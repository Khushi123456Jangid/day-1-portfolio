<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Success Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header -->
     <header class="hero">
        <div class="container">
            <p class="eyebrow">CAPSTONE</p>
            <h1>Student Success Dashboad</h1>
            <p class="her0-text">
                Manage students, analyze results and track academic performance.
            </p>
        </div>
     </header>
     <main class="container">
        <!-- show grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <span>Total Students</span>
                <strong id="totalStudents">0</strong>
            </div>
            <div class="stat-card">
                <span>Average Marks</span>
                <strong id="averageMarks">0</strong>
            </div>
            <div class="stat-card">
                <span>Highest Marks</span>
                <strong id="highestMarks">0</strong>
            </div>
            <div class="stat-card">
                <span>Passed Students</span>
                <strong id="passedStudents">0</strong>
            </div>
        </section>
        <!-- form -->
        <section class="panel">
            <div class="section-heading">
                <p class="eyebrow">STUDENT MANAGEMENT</p>
                <h2 id="formTitle">Add Student</h2>
            </div>
            <form id="studentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nameInput">Student Name</label>
                        <input type="text" id="nameInput" placeholder="Enter the student name" required>
                    </div>
                    <div class="form-group">
                        <label for="emailInput">Email</label>
                        <input type="text" id="emailInput" placeholder="Enter the email" required>
                    </div>
                    <div class="form-group">
                        <label for="courseInput">Course</label>
                        <select id="courseInput" required>
                            <option value="">Select Value</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="ECE">ECE</option>
                            <option value="ME">Mechanical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="marksInput">Marks</label>
                        <input type="number" id="marksInput" placeholder="Enter marks" min="0" max="100" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="primary-btn">Add Student</button>
                    <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
                </div>
            </form>
        </section>
        <!-- controls -->
         <section class="controls">
            <input type="text" id="searchInput" placeholder="Search student...">
            <select id="courseFilter">
                <option value="all">All Courses</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="ME">Mechanical</option>
            </select>
            <select id="sortSelect">
                <option value="default">Sort Marks</option>
                <option value="high">Highest First</option>
                <option value="low">Lowest First</option>
            </select>
        </section>
        <!-- loading -->
        <div id="loadingMessage" class="loading-message">Loading Dashboard...</div>
        <!-- section list -->
        <section id="studentList" class="student-grid"></section>
        <div id="emptyState" class="empty-state">
            <h3>No students found</h3>
            <p>Add a student or change your filters.</p>
        </div>
     </main>
     <script src="script.js"></script>
</body>
</html>
