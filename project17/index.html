<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Product Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
     <header class="header">
        <div class="container">
            <p class="eyebrow">MINI E-COMMERCE</p>
            <h1>Smart Product Search</h1>
            <p class="subtitle">Search products by name or category</p>
        </div>
     </header>
     <!-- main -->
      <main class="container main-content">
        <!-- search section -->
         <section class="search-section">
            <label for="searchBox">
                Search Products
            </label>
            <div class="search-wrapper">
                <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchBox" placeholder="Seach Laptop, Fashion, Home...">
            </div>
            <p class="search-input">Try something laptop, fashion, home, electronincs..</p>
         </section>
         <!-- filter -->
          <section class="filter-section">
            <div class="filter-heading">
                <div>
                    <p class="section-label">FILTER</p>
                    <h2>Category</h2>
                </div>
            </div>
            <div class="button-group">
                <button class="filter-button active" data-category="All">All</button>
                <button class="filter-button" data-category="Electronics">Electronics</button>
                <button class="filter-button" data-category="Fashion">Fashion</button>
                <button class="filter-button" data-category="Home">Home</button>
            </div>
          </section>
          <!-- product header -->
           <div class="product-header">
            <div>
                <p class="section-label">
                    RESULT
                </p>
                <h2>
                    Products
                </h2>
            </div>
            <span id="productCount">0 Products</span>
           </div>
           <!-- product grid -->
            <section id="productList" class="product-grid"></section>
      </main>
      <!--script -->
      <script src="script.js"></script>
</body>
</html>
