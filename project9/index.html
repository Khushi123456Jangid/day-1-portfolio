<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <div class="form">
            <input type="text" id="studentName" placeholder="Student name">
            <input type="number" id="studentMarks" placeholder="Student marks">
            <button onclick="addStudent()">
                Add Student
            </button>
        </div>
        <div id="studentList"></div>
        <div class="summary">
            <h2>Total Students : <span id="totalStudents">0</span></h2>
            <h2>Average Marks : <span id="averageMarks">0</span></h2>
            <h2>Highest Marks : <span id="highestMarks">0</span></h2>
            <h2>Top Student: <span id="topStudent">-</span></h2>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
