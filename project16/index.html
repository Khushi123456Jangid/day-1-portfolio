<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Replace your old font-awesome link with this stable version 6 link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
    <!-- header -->
    <header class="header">
        <div class="container">
            <p class="eyebrow">MINI STORE</p>
            <h1>Product Dashboard</h1>
            <p class="subtitle">Explore and sort products easily</p>
        </div>
    </header>
    <!-- main -->
     <main class="container main-content">
        <!-- sections -->
         <section class="controls">
            <div class="control-group">
                <h3>Category</h3>
                <div class="button-group">
                    <button class="filter-button active" data-category="All">All</button>
                    <button class="filter-button" data-category="Electronics">Electronics</button>
                    <button class="filter-button" data-category="Fashion">Fashion</button>
                    <button class="filter-button" data-category="Home">Home</button>
                </div>
            </div>
            <div class="control-group">
                <h3>Sort By Price</h3>
                <div class="button-group">
                    <button class="sort-button" data-sort="Low">Low <i class="fa-solid fa-arrow-right"></i> High</button>
                    <button class="sort-button" data-sort="High">High <i class="fa-solid fa-arrow-left"></i> Low</button>
                </div>
            </div>
         </section>
         <!-- product header -->
          <div class="product-header">
            <div>
                <p class="section-label">PRODUCTS</p>
                <h2>Available Products</h2>
            </div>
            <span id="productCount">0 Products</span>
          </div>
          <!-- section list -->
           <section id="productList" class="product-grid"></section>
     </main>
     <script src="script.js"></script>
</body>
</html>
