<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!-- header -->
     <header class="header">
        <div class="container header-content">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i><span>StudentHub</span>
            </div>
            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#students">Students</a>
            </nav>
        </div>
     </header>
     <!-- Hero -->
      <section class="hero">
        <div class="container">
            <p class="hero-label">
                STUDENT MANAGEMENT
            </p>
            <h1>Manage your <span>students easily</span></h1>
            <p class="hero-description">
                Add, search, edit and delete student information using JavaScript.
            </p>
        </div>
      </section>
      <!-- dashboard -->
       <main id="dashboard">
        <div class="container dashboard">
            <!-- form -->
             <section class="form-section">
                <div class="section-heading">
                    <p class="section-label">STUDENT FROM</p>
                    <h2 id="formTitle">Add New Student</h2>
                </div>
                <form id="studentForm">
                    <!-- name -->
                     <div class="form-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" placeholder="Enter student name" required>
                     </div>
                     <!-- email -->
                     <div class="form-group">
                        <label for="email">Student Email</label>
                        <input type="email" id="email" placeholder="student@example.com" required>
                     </div>
                     <!-- Age -->
                      <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Enter age" min="1" required>
                      </div>
                      <!-- course -->
                      <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course">
                            <option value="">Select Course</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="React">React</option>
                            <option value="Web Development">Web Development</option>
                        </select>
                      </div>
                      <!-- buttons -->
                      <div class="form-buttons">
                        <button type="submit" id="submitBtn" class="primary-btn">Add Student</button>
                        <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
                      </div>
                </form>
             </section>
             <!-- Students -->
              <section id="students" class="students-section">
                <div class="students-header">
                    <div>
                        <p class="section-label">STUDENT LIST</p>
                        <h2>All Students</h2>
                    </div>
                    <div id="studentCount" class="student-count">0 students</div>
                </div>
                <!-- search box -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search the student with name or course">
                </div>
                <!-- student list -->
                <div id="studentList" class="student-grid"></div>
                <!-- empty list -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon"><i class="fa-solid fa-user-graduate"></i></div>
                    <h3>No Student Found</h3>
                    <p>Add a student or change your search.</p>
                </div>
              </section>
        </div>
       </main>
       <!-- footer -->
        <footer>
            <p>© 2026 StudentHub</p>
        </footer>
        <script src="script.js"></script>
</body>
</html>
