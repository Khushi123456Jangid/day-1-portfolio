<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- main container -->
    <main class="container">
        <!-- header -->
         <header class="page-header">
            <div class="header-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
                <h1>Student Result Analyzer</h1>
                <p>Add students and analyze their results</p>
            </div>
         </header>
         <!-- add Student card -->
          <section class="card add-section">
            <div class="section-title">
                <h2>Add Student</h2>
                <p>Enter student's name and marks.</p>
            </div>
            <form id="studentForm">
                <!-- student name -->
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name" required>
                </div>
                <!-- student Marks -->
                 <div class="form-group">
                    <label for="marks">Marks</label>
                    <input type="number" id="marks" placeholder="0-100" min="0" max="100" required>
                 </div>
                 <button type="submit" class="primary-button">+ Add Student</button>
            </form>
          </section>
          <!-- Statics -->
           <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </span>
                <div>
                    <p>Total Students</p>
                    <h3 id="totalStudents">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">
                    <i class="fa-solid fa-square-check"></i>
                </span>
                <div>
                    <p>Passed</p>
                    <h3 id="passedStudents">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">
                    <i class="fa-solid fa-square-xmark"></i>
                </span>
                <div>
                    <p>Failed</p>
                    <h3 id="failedStudents">0</h3>
                </div>
            </div>
           </section>
           <!-- filter buttons -->
            <section class="card">
                <div class="section-title">
                    <h2>Student Result</h2>
                    <p>Choose what you want to see?</p>
                </div>
                <!-- fillter button -->
                 <div class="filter-buttons">
                    <button class="filter-button active" data-filter="all">All</button>
                    <button class="filter-button" data-filter="passed">Passed</button>
                    <button class="filter-button" data-filter="failed">Failed</button>
                    <button class="filter-button" data-filter="toppers">Toppers</button>
                 </div>
                 <!-- student list -->
                  <div id="studentList"></div>
            </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
